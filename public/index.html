<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202124"><title>Pegandekan Mail</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css?v=2"><script src="/app.js?v=2" defer></script></head><body><div id="toast" role="status" aria-live="polite"></div><main id="root"><p>Memuat Pegandekan Mail…</p></main><dialog id="compose"><form id="composeForm"><header><h2>Tulis email</h2><button type="button" data-close="compose">Tutup</button></header><label>Penerima<input name="to" placeholder="nama@pegandekan.web.id"></label><label>Subjek<input name="subject" maxlength="200"></label><label>Pesan<textarea name="body" rows="10" maxlength="40000"></textarea></label><label>Lampiran · maksimal 3 file, total 64 KB<input name="files" type="file" multiple></label><p id="attached" class="muted"></p><p class="muted">Pengiriman tersedia antarakun @pegandekan.web.id.</p><div class="actions"><button class="primary" type="submit">Kirim →</button><button type="button" id="saveDraft">Simpan draf</button></div></form></dialog><dialog id="account"><form id="accountForm"><header><h2>Ubah password</h2><button type="button" data-close="account">Tutup</button></header><label>Password saat ini<input name="current" type="password" required autocomplete="current-password"></label><label>Password baru<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="primary">Simpan dan login ulang</button></form></dialog></body></html>
